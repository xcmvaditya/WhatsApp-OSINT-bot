<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERONICA OSINT — Pair WhatsApp</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05080c; color: #c9f7d0;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: #0d1218; border: 1px solid #1f2a33;
    border-radius: 16px; padding: 40px;
    max-width: 480px; width: 100%;
    box-shadow: 0 0 40px rgba(124,247,160,0.1);
  }
  h1 {
    color: #7cf7a0; font-size: 24px;
    text-align: center; letter-spacing: 2px;
  }
  .sub {
    color: #5a7c66; font-size: 12px; text-align: center;
    margin-top: 8px; letter-spacing: 3px; text-transform: uppercase;
  }
  .status {
    display: flex; align-items: center; gap: 10px;
    padding: 12px; margin: 24px 0;
    background: #05080c; border-radius: 8px;
    border: 1px solid #1f2a33; font-size: 13px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #ff6b6b; animation: pulse 1.5s infinite;
  }
  .dot.on { background: #7cf7a0; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  label {
    color: #5a7c66; font-size: 11px;
    text-transform: uppercase; letter-spacing: 2px;
    display: block; margin: 20px 0 8px;
  }
  input {
    width: 100%; padding: 14px;
    background: #05080c; border: 1px solid #1f2a33;
    border-radius: 8px; color: #c9f7d0;
    font-family: inherit; font-size: 16px;
  }
  input:focus {
    outline: none; border-color: #7cf7a0;
    box-shadow: 0 0 15px rgba(124,247,160,0.2);
  }
  button {
    width: 100%; padding: 14px;
    background: #7cf7a0; color: #05080c;
    border: none; border-radius: 8px;
    font-family: inherit; font-weight: bold;
    font-size: 14px; cursor: pointer;
    letter-spacing: 1px; margin-top: 16px;
    transition: all .2s;
  }
  button:hover { background: #a3ffbe; box-shadow: 0 0 20px rgba(124,247,160,0.4); }
  button:disabled { background: #2a3a2f; color: #5a7c66; cursor: wait; }
  .code-box {
    display: none; margin-top: 20px; padding: 20px;
    background: #05080c; border: 1px solid #7cf7a0;
    border-radius: 8px; text-align: center;
  }
  .code-box.show { display: block; animation: fadeIn .3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
  .code-label { color: #5a7c66; font-size: 11px; letter-spacing: 2px; }
  .code-value {
    font-size: 28px; color: #7cf7a0; font-weight: bold;
    letter-spacing: 4px; margin: 12px 0;
    font-family: monospace;
  }
  .hint { color: #5a7c66; font-size: 11px; line-height: 1.7; margin-top: 12px; }
  .error {
    display: none; padding: 12px; margin-top: 16px;
    background: #1a0808; border: 1px solid #3a1a1a;
    border-radius: 8px; color: #ff8888; font-size: 12px;
  }
  .error.show { display: block; }
  footer {
    text-align: center; margin-top: 30px;
    padding-top: 20px; border-top: 1px solid #141a22;
    color: #3d5448; font-size: 11px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>◉ VERONICA OSINT</h1>
  <div class="sub">WhatsApp Pairing</div>

  <div class="status">
    <div class="dot" id="statusDot"></div>
    <div id="statusText">Checking...</div>
  </div>

  <label>WhatsApp Number (with country code)</label>
  <input type="text" id="phone" placeholder="919876543210" maxlength="15">

  <button id="pairBtn" onclick="doPair()">GET PAIRING CODE</button>

  <div class="error" id="errorBox"></div>

  <div class="code-box" id="codeBox">
    <div class="code-label">PAIRING CODE</div>
    <div class="code-value" id="codeValue">----</div>
    <div class="hint">
      1. WhatsApp → Settings<br>
      2. Linked Devices → Link a Device<br>
      3. <b>Link with phone number</b> tap karo<br>
      4. Upar wala code daalo
    </div>
  </div>

  <footer>
    👑 Developed by Adibhai
  </footer>
</div>

<script>
async function checkStatus() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    if (d.connected) {
      dot.classList.add('on');
      txt.textContent = '✅ Connected — ' + (d.name || d.user || 'WhatsApp');
    } else {
      dot.classList.remove('on');
      txt.textContent = 'Not paired yet';
    }
  } catch (e) {
    document.getElementById('statusText').textContent = 'Server offline';
  }
}

async function doPair() {
  const phone = document.getElementById('phone').value.replace(/[^0-9]/g, '');
  const btn = document.getElementById('pairBtn');
  const err = document.getElementById('errorBox');
  const codeBox = document.getElementById('codeBox');

  err.classList.remove('show');
  codeBox.classList.remove('show');

  if (phone.length < 10) {
    err.textContent = '⚠ Valid number daalo with country code';
    err.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'GENERATING...';

  try {
    const r = await fetch('/api/pair', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone })
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    document.getElementById('codeValue').textContent = d.code;
    codeBox.classList.add('show');
  } catch (e) {
    err.textContent = '⚠ ' + e.message;
    err.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'GET PAIRING CODE';
  }
}

document.getElementById('phone').addEventListener('keypress', e => {
  if (e.key === 'Enter') doPair();
});

checkStatus();
setInterval(checkStatus, 5000);
</script>
</body>
</html>
